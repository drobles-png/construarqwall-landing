<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción por ruta: los pone el router (src/content/copy.ts → SEO).
         Estos son los valores de la carga inicial (lo que leen los bots sin JS). -->
    <title>Construarqwall | Remodelaciones en Samborondón y Vía a la Costa</title>
    <meta name="description" content="Diseñamos y construimos remodelaciones de casas: patios, piscinas, cocinas y fachadas. Ves el render y el presupuesto antes de romper nada." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#faf8f5" />

    <!-- Meta Pixel: lo inyecta vite.config.ts (plugin metaPixel) con META_PIXEL_ID de
         src/config/funnel.ts. Vacío = sin pixel. No carga en localhost. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=Barlow:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Open Graph. og:image debe ser una URL ABSOLUTA del dominio final (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Construarqwall" />
    <meta property="og:title" content="Construarqwall | Remodelaciones en Samborondón y Vía a la Costa" />
    <meta property="og:description" content="Diseñamos y construimos remodelaciones de casas: patios, piscinas, cocinas y fachadas. Ves el render y el presupuesto antes de romper nada." />
    <meta property="og:image" content="https://thewall-lng.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://thewall-lng.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
